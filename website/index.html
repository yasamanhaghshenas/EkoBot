<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EkoBot — IEU Campus Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root[data-theme="light"] {
      --bg: #f4f6fb;
      --sidebar-bg: #ffffff;
      --chat-bg: #f4f6fb;
      --bubble-bot: #ffffff;
      --bubble-user: #1a56a0;
      --bubble-bot-text: #1a1f36;
      --bubble-user-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #dde2ef;
      --text-primary: #1a1f36;
      --text-secondary: #6b7698;
      --accent: #1a56a0;
      --accent-hover: #154285;
      --accent-soft: #e8f0fb;
      --shadow: rgba(26,31,54,0.08);
      --shadow-md: rgba(26,31,54,0.13);
      --header-bg: #ffffff;
      --divider: #e8ecf5;
      --chat-item-hover: #f0f4fb;
      --chat-item-active: #e8f0fb;
      --tag-bg: #eef2ff;
      --tag-text: #3a4fc4;
      --scrollbar: #dde2ef;
      --new-chat-bg: #1a56a0;
      --new-chat-text: #ffffff;
    }

    :root[data-theme="dark"] {
      --bg: #0d0f1a;
      --sidebar-bg: #13162a;
      --chat-bg: #0d0f1a;
      --bubble-bot: #1a1f36;
      --bubble-user: #1a56a0;
      --bubble-bot-text: #e2e8f8;
      --bubble-user-text: #ffffff;
      --input-bg: #1a1f36;
      --input-border: #2a3060;
      --text-primary: #e2e8f8;
      --text-secondary: #6b7aaa;
      --accent: #4d8ef0;
      --accent-hover: #3a7de0;
      --accent-soft: #1a2450;
      --shadow: rgba(0,0,0,0.35);
      --shadow-md: rgba(0,0,0,0.5);
      --header-bg: #13162a;
      --divider: #1e2445;
      --chat-item-hover: #1a1f36;
      --chat-item-active: #1e274a;
      --tag-bg: #1a2450;
      --tag-text: #7ba7f0;
      --scrollbar: #2a3060;
      --new-chat-bg: #4d8ef0;
      --new-chat-text: #ffffff;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 270px;
      min-width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--divider);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #1a56a0 0%, #4d8ef0 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(26,86,160,0.3);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 1px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 9px 14px;
      background: var(--new-chat-bg);
      color: var(--new-chat-text);
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(26,86,160,0.25);
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26,86,160,0.35);
    }

    .new-chat-btn .plus {
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.25);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    /* ── CHAT HISTORY LIST ── */
    .history-section {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px;
    }

    .history-section::-webkit-scrollbar { width: 3px; }
    .history-section::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    .history-section::-webkit-scrollbar-track { background: transparent; }

    .history-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 10px 8px 4px;
    }

    .chat-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
    }

    .chat-item:hover { background: var(--chat-item-hover); }
    .chat-item.active { background: var(--chat-item-active); }

    .chat-item-icon {
      width: 28px; height: 28px;
      background: var(--accent-soft);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .chat-item.active .chat-item-icon {
      background: var(--accent);
    }

    .chat-item-body { flex: 1; min-width: 0; }

    .chat-item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .chat-item.active .chat-item-title { color: var(--accent); font-weight: 600; }

    .chat-item-preview {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .chat-item-time {
      font-size: 10.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .chat-item-delete {
      display: none;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px; height: 22px;
      background: var(--divider);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.12s;
    }

    .chat-item:hover .chat-item-delete { display: flex; }
    .chat-item-delete:hover { background: #fee2e2; color: #ef4444; }

    .empty-history {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-history .empty-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── SIDEBAR BOTTOM ── */
    .sidebar-bottom {
      padding: 12px 8px;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lang-toggle {
      display: flex;
      background: var(--accent-soft);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--divider);
    }

    .lang-btn {
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }

    .lang-btn.active { background: var(--accent); color: white; border-radius: 7px; }

    .theme-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--divider);
      background: var(--input-bg);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--text-primary);
    }

    .theme-btn:hover { background: var(--accent-soft); }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── HEADER ── */
    .header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--divider);
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 11px; }

    .header-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #1a56a0, #4d8ef0);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      box-shadow: 0 2px 8px rgba(26,86,160,0.25);
    }

    .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }

    .header-status {
      font-size: 12px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .status-dot {
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .clear-btn {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--divider);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .clear-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }

    /* ── WELCOME ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 20px;
      padding: 48px 32px;
      text-align: center;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #1a56a0 0%, #4d8ef0 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 12px 40px rgba(26,86,160,0.28);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .welcome h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 440px;
      line-height: 1.65;
    }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 540px;
      margin-top: 4px;
    }

    .suggestion-card {
      background: var(--bubble-bot);
      border: 1.5px solid var(--divider);
      border-radius: 12px;
      padding: 13px 15px;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s;
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      line-height: 1.45;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .suggestion-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow-md);
      color: var(--accent);
    }

    .suggestion-card .s-icon {
      font-size: 20px;
      margin-bottom: 7px;
      display: block;
    }

    /* ── MESSAGES ── */
    .message {
      display: flex;
      gap: 11px;
      max-width: 72%;
      animation: msgIn 0.2s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { margin-left: auto; flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .bot-avatar {
      background: linear-gradient(135deg, #1a56a0, #4d8ef0);
      box-shadow: 0 2px 8px rgba(26,86,160,0.25);
    }

    .user-avatar {
      background: linear-gradient(135deg, #5b5fc7, #8b5cf6);
      box-shadow: 0 2px 8px rgba(91,95,199,0.25);
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      box-shadow: 0 2px 10px var(--shadow);
    }

    .bubble-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .option-btn {
      border: 1px solid var(--accent-soft);
      background: var(--bubble-bot);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px var(--shadow);
      text-align: left;
      white-space: normal;
      line-height: 1.35;
    }

    .option-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.7;
      transform: none;
    }

    .bot .bubble {
      background: var(--bubble-bot);
      color: var(--bubble-bot-text);
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      padding: 0 3px;
    }

    .message.user .msg-time { text-align: right; }

    /* ── TYPING ── */
    .typing {
      display: flex;
      gap: 11px;
      align-items: flex-end;
      animation: msgIn 0.2s ease;
    }

    .typing-bubble {
      background: var(--bubble-bot);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 13px 17px;
      display: flex;
      gap: 5px;
      align-items: center;
      box-shadow: 0 2px 10px var(--shadow);
    }

    .typing-bubble span {
      width: 7px; height: 7px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typingBounce 1.3s infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── INPUT ── */
    .input-area {
      padding: 14px 24px 18px;
      background: var(--header-bg);
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,86,160,0.1), 0 2px 12px var(--shadow);
    }

    #userInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-primary);
      resize: none;
      max-height: 120px;
      line-height: 1.55;
      font-family: 'DM Sans', sans-serif;
      padding: 6px 0;
    }

    #userInput::placeholder { color: var(--text-secondary); }

    .send-btn {
      width: 36px; height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      align-self: center;
      color: white;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(26,86,160,0.3);
    }

    .input-wrapper.multiline .send-btn { align-self: flex-end; }

    .send-btn:hover { background: var(--accent-hover); transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 7px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .message { max-width: 90%; }
      .suggestions { grid-template-columns: 1fr; }
      .messages { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-top">
    <div class="logo-row">
      <div class="logo-icon">🎓</div>
      <div>
        <div class="logo-text">EkoBot</div>
        <div class="logo-sub">IEU Campus Assistant</div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <span class="plus">+</span>
      <span id="btn-new-chat">New Chat</span>
    </button>
  </div>

  <div class="history-section" id="historyList">
    <!-- populated by JS -->
  </div>

  <div class="sidebar-bottom">
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('tr')">TR</button>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="header">
    <div class="header-left">
      <div class="header-avatar">🤖</div>
      <div>
        <div class="header-title" id="header-title">EkoBot</div>
        <div class="header-status">
          <div class="status-dot"></div>
          <span id="header-status">Online</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="clear-btn" onclick="clearCurrentChat()" id="clear-btn" style="display:none">
        🗑️ <span id="btn-clear">Clear</span>
      </button>
    </div>
  </div>

  <div class="messages" id="messages">
    <!-- welcome screen shown by default -->
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Ask about courses, prerequisites, schedule..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint" id="input-hint">Press Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script>
  // ── CONFIG ──
const API_URL = window.location.origin + '/chat';
  let currentLang = 'en';
  let isWaiting = false;

  // ── CHAT HISTORY STATE ──
  // Each chat: { id, title, preview, time, messages: [{role, text, time}] }
  let chats = JSON.parse(localStorage.getItem('ekobot_chats') || '[]');
  let currentChatId = null;

  // ── TRANSLATIONS ──
  const tx = {
    en: {
      headerStatus: 'Online',
      welcomeTitle: "Hello! I'm EkoBot 👋",
      welcomeDesc: "Ask me about IEU courses, prerequisites, semester planning, graduation requirements, and GPA-credit rules.",
      placeholder: "Ask about courses, prerequisites, schedule...",
      inputHint: "Press Enter to send · Shift+Enter for new line",
      btnNewChat: "New Chat",
      btnClear: "Clear",
      todayLabel: "Today",
      yesterdayLabel: "Yesterday",
      olderLabel: "Older",
      emptyHistory: "No chats yet.\nStart a conversation!",
      you: "You",
      suggestions: [
        { icon: "🧭", text: "I’m 2nd year spring. Which courses should I take?", q: "I am in 2nd year spring. Which courses should I take?" },
        { icon: "💳", text: "How many credits can I take with GPA 2.2?", q: "My GPA is 2.2. How many credits can I take this semester?" },
        { icon: "🎓", text: "What are my graduation requirements?", q: "What are the graduation requirements for my department?" },
        { icon: "📘", text: "Can you explain a course code?", q: "Tell me about this course: SE 302." }
      ]
    },
    tr: {
      headerStatus: 'Çevrimiçi',
      welcomeTitle: "Merhaba! Ben EkoBot 👋",
      welcomeDesc: "İEÜ dersleri, ön koşullar, dönem planlama, mezuniyet koşulları ve GPA-kredi kuralları hakkında sorabilirsiniz.",
      placeholder: "Dersler, ön koşullar, program hakkında sorun...",
      inputHint: "Göndermek için Enter · Yeni satır için Shift+Enter",
      btnNewChat: "Yeni Sohbet",
      btnClear: "Temizle",
      todayLabel: "Bugün",
      yesterdayLabel: "Dün",
      olderLabel: "Daha Eski",
      emptyHistory: "Henüz sohbet yok.\nBir konuşma başlatın!",
      you: "Siz",
      suggestions: [
        { icon: "🧭", text: "2. sınıf bahardayım, hangi dersleri almalıyım?", q: "2. sınıf bahar dönemindeyim. Hangi dersleri almalıyım?" },
        { icon: "💳", text: "2.2 GPA ile kaç kredi alabilirim?", q: "Not ortalamam 2.2. Bu dönem kaç kredi alabilirim?" },
        { icon: "🎓", text: "Mezuniyet şartlarım neler?", q: "Bölümümün mezuniyet şartları nelerdir?" },
        { icon: "📘", text: "Bir ders kodunu açıklayabilir misin?", q: "Şu ders hakkında bilgi ver: SE 302." }
      ]
    }
  };

  // ── SAVE / LOAD ──
  function saveChats() {
    localStorage.setItem('ekobot_chats', JSON.stringify(chats));
  }

  function getChat(id) {
    return chats.find(c => c.id === id);
  }

  // ── RENDER HISTORY SIDEBAR ──
  function renderHistory() {
    const list = document.getElementById('historyList');
    const t = tx[currentLang];

    if (chats.length === 0) {
      list.innerHTML = `
        <div class="empty-history">
          <div class="empty-icon">💬</div>
          <div style="white-space:pre-line">${t.emptyHistory}</div>
        </div>`;
      return;
    }

    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const yesterdayStart = todayStart - 86400000;

    const groups = { today: [], yesterday: [], older: [] };

    [...chats].reverse().forEach(chat => {
      const ts = chat.updatedAt || 0;
      if (ts >= todayStart) groups.today.push(chat);
      else if (ts >= yesterdayStart) groups.yesterday.push(chat);
      else groups.older.push(chat);
    });

    let html = '';

    const renderGroup = (label, items) => {
      if (!items.length) return;
      html += `<div class="history-label">${label}</div>`;
      items.forEach(chat => {
        const isActive = chat.id === currentChatId;
        html += `
          <div class="chat-item ${isActive ? 'active' : ''}" onclick="loadChat('${chat.id}')">
            <div class="chat-item-icon">${isActive ? '💬' : '🗨️'}</div>
            <div class="chat-item-body">
              <div class="chat-item-title">${escapeHtml(chat.title)}</div>
              <div class="chat-item-preview">${escapeHtml(chat.preview || '')}</div>
            </div>
            <div class="chat-item-time">${formatTime(chat.updatedAt)}</div>
            <button class="chat-item-delete" onclick="deleteChat(event, '${chat.id}')">✕</button>
          </div>`;
      });
    };

    renderGroup(t.todayLabel, groups.today);
    renderGroup(t.yesterdayLabel, groups.yesterday);
    renderGroup(t.olderLabel, groups.older);

    list.innerHTML = html;
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (ts >= todayStart) {
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── WELCOME SCREEN ──
  function showWelcome() {
    const t = tx[currentLang];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🎓</div>
        <h2 id="welcome-title">${t.welcomeTitle}</h2>
        <p id="welcome-desc">${t.welcomeDesc}</p>
        <div class="suggestions">
          ${t.suggestions.map(s => `
            <div class="suggestion-card" onclick="sendSuggestion('${s.q.replace(/'/g,"\\'")}')">
              <span class="s-icon">${s.icon}</span>${escapeHtml(s.text)}
            </div>`).join('')}
        </div>
      </div>`;
    document.getElementById('clear-btn').style.display = 'none';
  }

  // ── NEW CHAT ──
  function newChat() {
    currentChatId = null;
    showWelcome();
    renderHistory();
    document.getElementById('userInput').focus();
  }

  // ── LOAD CHAT ──
  function loadChat(id) {
    const chat = getChat(id);
    if (!chat) return;

    currentChatId = id;
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';

    chat.messages.forEach(m => {
      if (m.hidden) return;
      appendBubble(m.text, m.role === 'user', m.time, false, m.options || null);
    });

    document.getElementById('clear-btn').style.display = 'flex';
    renderHistory();
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ── DELETE CHAT ──
  function deleteChat(e, id) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) newChat();
    else renderHistory();
  }

  // ── CLEAR CURRENT CHAT ──
  function clearCurrentChat() {
    if (!currentChatId) return;
    chats = chats.filter(c => c.id !== currentChatId);
    saveChats();
    newChat();
  }

  // ── ADD BUBBLE ──
  function buildBubbleNode(text, isUser, timeStr, options = null) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;

    const avatar = document.createElement('div');
    avatar.className = `msg-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}`;
    avatar.textContent = isUser ? '👤' : '🤖';
    div.appendChild(avatar);

    const body = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = escapeHtml(String(text ?? '')).replace(/\n/g, '<br>');
    body.appendChild(bubble);

    if (!isUser && Array.isArray(options) && options.length > 0) {
      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'bubble-options';
      options.forEach(opt => {
        const value = (opt && typeof opt === 'object')
          ? String(opt.value ?? opt.label ?? '')
          : String(opt ?? '');
        const label = (opt && typeof opt === 'object')
          ? String(opt.label ?? opt.value ?? '')
          : String(opt ?? '');
        if (!value && !label) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = label || value;
        btn.addEventListener('click', () => sendOption(value || label));
        optionsWrap.appendChild(btn);
      });
      if (optionsWrap.childElementCount > 0) {
        body.appendChild(optionsWrap);
      }
    }

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = timeStr || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    body.appendChild(time);

    div.appendChild(body);
    return div;
  }

  function replaceBubbleNode(target, text, isUser, timeStr, options = null) {
    if (!target || !target.parentNode) return null;
    const updated = buildBubbleNode(text, isUser, timeStr, options);
    target.parentNode.replaceChild(updated, target);
    return updated;
  }

  function appendBubble(text, isUser, timeStr, scroll = true, options = null) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    document.getElementById('clear-btn').style.display = 'flex';

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;

    const avatar = isUser ? '👤' : '🤖';
    const avatarClass = isUser ? 'user-avatar' : 'bot-avatar';
    const t = timeStr || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const body = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = escapeHtml(String(text ?? '')).replace(/\n/g, '<br>');
    body.appendChild(bubble);

    if (!isUser && Array.isArray(options) && options.length > 0) {
      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'bubble-options';
      options.forEach(opt => {
        const value = (opt && typeof opt === 'object')
          ? String(opt.value ?? opt.label ?? '')
          : String(opt ?? '');
        const label = (opt && typeof opt === 'object')
          ? String(opt.label ?? opt.value ?? '')
          : String(opt ?? '');
        if (!value && !label) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = label || value;
        btn.addEventListener('click', () => sendOption(value || label));
        optionsWrap.appendChild(btn);
      });
      if (optionsWrap.childElementCount > 0) {
        body.appendChild(optionsWrap);
      }
    }

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = t;
    body.appendChild(time);

    div.innerHTML = `<div class="msg-avatar ${avatarClass}">${avatar}</div>`;
    div.appendChild(body);

    msgs.appendChild(div);
    if (scroll) msgs.scrollTop = msgs.scrollHeight;
    return t;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="msg-avatar bot-avatar">🤖</div>
      <div class="typing-bubble"><span></span><span></span><span></span></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ── SEND MESSAGE ──
  async function sendMessage(forcedQuestion = null, showUserBubble = true) {
    const input = document.getElementById('userInput');
    const question = (forcedQuestion !== null && forcedQuestion !== undefined)
      ? String(forcedQuestion).trim()
      : input.value.trim();
    if (!question || isWaiting) return;

    input.value = '';
    autoResize(input);
    isWaiting = true;
    document.getElementById('sendBtn').disabled = true;

    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (showUserBubble) {
      appendBubble(question, true, timeStr);
    }
    showTyping();

    // create new chat if none active
    if (!currentChatId) {
      currentChatId = Date.now().toString();
      chats.push({
        id: currentChatId,
        title: question.length > 40 ? question.slice(0, 40) + '…' : question,
        preview: '',
        updatedAt: Date.now(),
        messages: []
      });
    }

    // save user message
    const chat = getChat(currentChatId);
    chat.messages.push({
      role: 'user',
      text: question,
      time: timeStr,
      hidden: !showUserBubble,
      source: showUserBubble ? 'typed' : 'option'
    });
    chat.updatedAt = Date.now();
    saveChats();

    try {
     const response = await fetch(API_URL, {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          // Send recent *prior* messages (exclude the question we just added),
          // otherwise the backend sees the current question twice and we lose
          // older profiling answers sooner.
          history: chat.messages.slice(0, -1).slice(-12).map(m => ({
            role: m.role === 'user' ? 'user' : 'assistant',
            content: m.text
         }))
       })
     });
      
      const raw = await response.text();
      let data = null;
      try {
        data = raw ? JSON.parse(raw) : {};
      } catch (parseErr) {
        data = null;
      }
      if (!response.ok) {
        const detail = data && typeof data === 'object'
          ? (data.detail || data.message || data.error)
          : null;
        throw new Error(detail || raw || `HTTP ${response.status}`);
      }
      if (!data || typeof data !== 'object') {
        throw new Error(raw || `Invalid response from server (${response.status}).`);
      }
      removeTyping();

      const botTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const followupMode = String(data.followup_mode || 'replace').toLowerCase();
      const botMessages = chat.messages
        .map((m, idx) => ({ m, idx }))
        .filter(item => item.m.role === 'bot');
      const lastBotMessage = botMessages.length ? botMessages[botMessages.length - 1] : null;
      const shouldSwapFollowup = Boolean(
        data.is_followup &&
        followupMode !== 'append' &&
        lastBotMessage &&
        (lastBotMessage.m.isFollowup || (Array.isArray(lastBotMessage.m.options) && lastBotMessage.m.options.length > 0)) &&
        Array.isArray(data.options) && data.options.length > 0
      );

      if (shouldSwapFollowup) {
        const msgs = document.getElementById('messages');
        const domBotMessages = msgs.querySelectorAll('.message.bot');
        const lastDomBotMessage = domBotMessages.length ? domBotMessages[domBotMessages.length - 1] : null;
        if (lastDomBotMessage) {
          replaceBubbleNode(lastDomBotMessage, data.answer, false, botTime, data.options || null);
        } else {
          appendBubble(data.answer, false, botTime, true, data.options || null);
        }

        chat.messages[lastBotMessage.idx] = {
          role: 'bot',
          text: data.answer,
          time: botTime,
          options: data.options || null,
          isFollowup: true,
          followupMode: followupMode
        };
      } else {
        appendBubble(data.answer, false, botTime, true, data.options || null);

        // save bot message
        chat.messages.push({
          role: 'bot',
          text: data.answer,
          time: botTime,
          options: data.options || null,
          isFollowup: !!data.is_followup,
          followupMode: followupMode
        });
      }

      chat.preview = data.answer.slice(0, 60) + (data.answer.length > 60 ? '…' : '');
      chat.updatedAt = Date.now();
      saveChats();

    } catch (err) {
      removeTyping();
      const errMsg = "⚠️ Could not connect to EkoBot server. Make sure the Python backend is running.";
      appendBubble(errMsg, false);
      const chat = getChat(currentChatId);
      if (chat) {
        chat.messages.push({ role: 'bot', text: errMsg, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) });
        saveChats();
      }
    }

    renderHistory();
    isWaiting = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function sendSuggestion(q) {
    sendMessage(q);
  }

  function sendOption(value) {
    sendMessage(value, false);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    const wrapper = el.closest('.input-wrapper');
    if (wrapper) wrapper.classList.toggle('multiline', el.scrollHeight > 40);
  }

  // ── LANGUAGE ──
  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
    applyTranslations();
    if (!currentChatId) showWelcome();
  }

  function applyTranslations() {
    const t = tx[currentLang];
    document.getElementById('header-status').textContent = t.headerStatus;
    document.getElementById('userInput').placeholder = t.placeholder;
    document.getElementById('input-hint').textContent = t.inputHint;
    document.getElementById('btn-new-chat').textContent = t.btnNewChat;
    document.getElementById('btn-clear').textContent = t.btnClear;
    renderHistory();
  }

  // ── THEME ──
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.dataset.theme === 'dark';
    html.dataset.theme = isDark ? 'light' : 'dark';
    document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  }

  // ── INIT ──
  showWelcome();
  renderHistory();
</script>
